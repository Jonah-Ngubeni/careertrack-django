name: Test CareerTrack Docker Image

on:
  push:
    branches:
      - container
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "applications/**"
      - "job_tracker/**"
      - ".github/workflows/docker-test.yml"
  workflow_dispatch:

jobs:
  docker-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t careertrack .

      - name: Run Django checks
        run: docker run --rm careertrack python manage.py check

      - name: Run Django tests
        run: docker run --rm careertrack python manage.py test
